name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check alias package metadata
        run: node scripts/sync-alias-packages.mjs --check

      - name: Check tag version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          expected_tag="v$VERSION"
          if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $VERSION."
            echo "Expected tag: $expected_tag"
            exit 1
          fi

      - name: Check package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          package_specs=(
            "@wpmoo/toolkit@$VERSION"
            "wpmoo@$VERSION"
            "@wpmoo/odoo@$VERSION"
            "@wpmoo/odoo-dev@$VERSION"
          )
          for spec in "${package_specs[@]}"; do
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec already exists on npm."
              echo "Bump package.json and package-lock.json before publishing."
              exit 1
            fi
          done

      - name: Check package dry run
        run: |
          npm pack --dry-run
          npm pack --dry-run ./packages/wpmoo
          npm pack --dry-run ./packages/odoo-compat
          npm pack --dry-run ./packages/odoo-dev-compat

      - name: Publish toolkit to npm
        run: npm publish --access public

      - name: Publish aliases to npm
        run: |
          npm publish --access public ./packages/wpmoo
          npm publish --access public ./packages/odoo-compat
          npm publish --access public ./packages/odoo-dev-compat
