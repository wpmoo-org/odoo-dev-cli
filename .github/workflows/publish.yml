name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check alias package metadata
        run: node scripts/sync-alias-packages.mjs --check

      - name: Check tag version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          expected_tag="v$VERSION"
          if [[ "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $VERSION."
            echo "Expected tag: $expected_tag"
            exit 1
          fi

      - name: Check required package publish state
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "Checking required scoped artifacts for release validity:"
          package_specs=(
            "@wpmoo/toolkit@$VERSION"
            "@wpmoo/odoo@$VERSION"
            "@wpmoo/odoo-dev@$VERSION"
          )
          for spec in "${package_specs[@]}"; do
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "[required] $spec already exists on npm; publish step will skip it."
            else
              echo "[required] $spec is not published yet."
            fi
          done

      - name: Check optional short alias publish state
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "Checking optional short alias artifact (best-effort):"
          spec="wpmoo@$VERSION"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "[optional] $spec already exists on npm; optional alias publish step will skip it."
          else
            echo "[optional] $spec is not published yet. If npm rejects the short alias publish, the workflow will emit a warning and keep scoped artifacts valid."
          fi

      - name: Check package dry run
        run: |
          npm pack --dry-run
          npm pack --dry-run ./packages/wpmoo
          npm pack --dry-run ./packages/odoo-compat
          npm pack --dry-run ./packages/odoo-dev-compat

      - name: Publish toolkit to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          spec="@wpmoo/toolkit@$VERSION"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec already exists on npm; skipping publish."
          else
            npm publish --access public
          fi

      - name: Publish @wpmoo/odoo alias to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          spec="@wpmoo/odoo@$VERSION"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec already exists on npm; skipping publish."
          else
            npm publish --access public ./packages/odoo-compat
          fi

      - name: Publish @wpmoo/odoo-dev alias to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          spec="@wpmoo/odoo-dev@$VERSION"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec already exists on npm; skipping publish."
          else
            npm publish --access public ./packages/odoo-dev-compat
          fi

      - name: Publish wpmoo short alias to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          spec="wpmoo@$VERSION"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec already exists on npm; skipping publish."
          elif npm publish --access public ./packages/wpmoo; then
            echo "$spec published."
          else
            echo "::warning title=Optional wpmoo alias not published::The wpmoo short alias could not be published. Scoped packages remain the supported release artifacts."
          fi

      - name: Verify required scoped artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          required_specs=(
            "@wpmoo/toolkit@$VERSION"
            "@wpmoo/odoo@$VERSION"
            "@wpmoo/odoo-dev@$VERSION"
          )
          missing_specs=()

          for spec in "${required_specs[@]}"; do
            verified=0
            for attempt in {1..12}; do
              if npm view "$spec" version >/dev/null 2>&1; then
                echo "[required] [ok] $spec published"
                verified=1
                break
              fi
              echo "[required] $spec not visible yet; retry $attempt/12."
              sleep 5
            done

            if [[ "$verified" -ne 1 ]]; then
              missing_specs+=("$spec")
            fi
          done

          if [[ "${#missing_specs[@]}" -gt 0 ]]; then
            echo "::error title=Required scoped artifacts did not verify after publish::${missing_specs[*]}"
            exit 1
          fi

      - name: Add release candidate report
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          required_specs=(
            "@wpmoo/toolkit@$VERSION"
            "@wpmoo/odoo@$VERSION"
            "@wpmoo/odoo-dev@$VERSION"
          )
          alias_spec="wpmoo@$VERSION"

          if [[ -z "${GITHUB_STEP_SUMMARY:-}" ]]; then
            exit 0
          fi

          {
            echo "## Release Candidate Report"
            echo ""
            echo "### Required Scoped Artifacts (release-validating)"
            for spec in "${required_specs[@]}"; do
              if npm view "$spec" version >/dev/null 2>&1; then
                echo "- [required] [ok] $spec published"
              else
                echo "- [required] [error] $spec missing after publish verification"
              fi
            done
            echo ""
            echo "### Optional Short Alias (best-effort)"
            if npm view "$alias_spec" version >/dev/null 2>&1; then
              echo "- [optional] [ok] $alias_spec published"
            else
              echo "- [optional] [warning] $alias_spec is optional; if publish failed, scoped artifacts still define release validity."
            fi
            echo ""
            echo "### Smoke Check Command"
            echo "- \`npm run smoke:published -- \"$VERSION\"\`"
          } >> "$GITHUB_STEP_SUMMARY"
